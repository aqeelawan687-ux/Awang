name: Build and Release Signed APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Keystore
        id: decode_keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing or empty. A valid keystore is required for release signing."
            exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-upload-key.jks
          if [ ! -s my-upload-key.jks ]; then
            echo "::error::my-upload-key.jks could not be created or is empty. Check KEYSTORE_BASE64 secret."
            exit 1
          fi
          echo "Keystore decoded successfully: my-upload-key.jks"

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify Signed APK
        run: |
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$RELEASE_APK" ]; then
            echo "::error::Signed release APK was not generated. Check release signing configuration and GitHub Secrets."
            exit 1
          fi

          echo "Found release APK: $RELEASE_APK"
          echo "File size: $(ls -lh "$RELEASE_APK" | awk '{print $5}')"
          echo "SHA-256: $(sha256sum "$RELEASE_APK" | awk '{print $1}')"

          # Locate apksigner
          APKSIGNER_BIN="$(which apksigner 2>/dev/null || find "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}" -name apksigner 2>/dev/null | head -n 1)"
          if [ -n "$APKSIGNER_BIN" ] && [ -x "$APKSIGNER_BIN" ]; then
            echo "Verifying signature with $APKSIGNER_BIN..."
            "$APKSIGNER_BIN" verify --verbose "$RELEASE_APK"
          else
            echo "apksigner not found in PATH or SDK directory, checking zip integrity..."
            unzip -t "$RELEASE_APK" META-INF/* >/dev/null 2>&1 || {
              echo "::error::Release APK signature verification failed - META-INF signatures missing."
              exit 1
            }
          fi

      - name: Prepare Release Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk release-assets/app-release.apk

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: release-assets/app-release.apk

      - name: Determine Version Details
        id: version_info
        run: |
          GRADLE_VER_NAME=$(grep -oE 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | sed -E 's/versionName\s*=\s*"([^"]+)"/\1/' || echo "1.3.2")
          GRADLE_VER_CODE=$(grep -oE 'versionCode\s*=\s*[0-9]+' app/build.gradle.kts | grep -oE '[0-9]+' || echo "132")

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            CLEAN_VER=$(echo "$TAG_NAME" | sed 's/^v//')
          else
            CLEAN_VER="$GRADLE_VER_NAME"
            TAG_NAME="v$CLEAN_VER"
          fi

          echo "RELEASE_TAG=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$CLEAN_VER" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$GRADLE_VER_CODE" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/app-release.apk
          tag_name: ${{ steps.version_info.outputs.RELEASE_TAG }}
          name: Aqeel Rider Release ${{ steps.version_info.outputs.RELEASE_TAG }}
          body: |
            ## Aqeel Rider App Release ${{ steps.version_info.outputs.RELEASE_TAG }}
            
            - **App**: Aqeel Rider (عقیل رائڈر)
            - **Version**: ${{ steps.version_info.outputs.VERSION_NAME }}
            - **versionCode**: ${{ steps.version_info.outputs.VERSION_CODE }}
            - **Asset**: `app-release.apk`
            
            ### Instructions
            Download and install `app-release.apk` directly on your Android phone or update via the in-app updater.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
